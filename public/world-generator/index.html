<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Turn a seed into a world. Explore regional terrain on an interactive globe or map.">
  <title>World Generator</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body class="loading">
  <section id="intro" aria-label="Loading the world generator">
    <div class="intro-content">
      <canvas id="intro-globe" aria-hidden="true"></canvas>
      <div class="intro-copy">
        <div role="status" aria-live="polite">
          <h1 id="intro-title">Loading the world generator</h1>
          <p id="intro-note" hidden></p>
        </div>
        <button id="intro-cancel" type="button">Cancel</button>
      </div>
    </div>
  </section>
  <main id="world" aria-busy="true" inert>
    <canvas id="globe" tabindex="0" aria-label="Interactive world globe"></canvas>
    <div id="empty" role="status">Loading world…</div>
  </main>
  <div class="toolbar" inert>
    <form id="generator">
      <div class="seed-field">
        <label for="seed">World seed</label>
        <input id="seed" type="text" inputmode="numeric" autocomplete="off" maxlength="20" value="42" required pattern="[0-9]{1,20}" disabled>
        <button id="copy-seed" type="button" class="icon-button" title="Copy seed" aria-label="Copy seed" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg></button>
      </div>
      <button id="generate" type="submit" class="primary" disabled>Generate world</button>
      <button id="random" type="button" disabled>Random world</button>
      <button id="cancel" type="button" hidden>Cancel</button>
    </form>
    <div class="view-tools">
      <div class="view-switch" role="group" aria-label="View">
        <button id="view-globe" aria-pressed="true">Globe</button>
        <button id="view-map" aria-pressed="false">2D map</button>
      </div>
      <button id="reset" class="icon-button" title="Reset view" aria-label="Reset view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button>
    </div>
  </div>
  <p id="status" role="status" aria-live="polite" hidden></p>
  <aside id="panel" aria-label="Display and legend" inert>
    <div class="display-controls">
      <label class="sr-only" for="colour">Colour</label>
      <select id="colour"><option value="0">Terrain</option><option value="1">Water</option><option value="2">Elevation</option><option value="3">Plates</option><option value="4">Crust</option></select>
      <details id="display" open>
        <summary>Options</summary>
        <div class="display-content">
          <div id="relief-control">
            <label class="range-label" for="exaggeration">Vertical exaggeration <output id="scale" for="exaggeration">32×</output></label>
            <input id="exaggeration" type="range" min="1" max="60" value="32">
          </div>
          <label class="check"><input id="boundaries" type="checkbox">Plate boundaries</label>
        </div>
      </details>
    </div>
    <div id="legend" aria-label="Legend">
      <div id="terrain-key">
        <div class="legend-item"><i class="swatch ocean"></i>Connected ocean</div>
        <div class="metric">Sea level <span id="sea-level">—</span></div>
        <div class="legend-item"><i class="swatch land"></i>Land</div>
        <div class="legend-item"><i class="swatch basin"></i>Basin candidates</div>
      </div>
      <div id="alternate-key" hidden></div>
      <div id="height-key" hidden>
        <span class="height-title">Elevation</span>
        <div class="height-gradient" aria-hidden="true"></div>
        <div class="height-labels"><span id="height-low">—</span><span id="height-high">—</span></div>
      </div>
      <div class="elevation-range"><span>Elevation</span><span id="elevation-range">—</span></div>
    </div>
  </aside>
  <noscript>This demo needs JavaScript and a browser with WebGL enabled.</noscript>
</body>
</html>
