<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>starfield</title>
    <link rel="stylesheet" href="./styles.css?v=interaction-hint-1">
    <link rel="stylesheet" href="/home-link.css">
  </head>
  <body>
    <a class="portfolio-home-link" href="/" aria-label="Back to home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg>
    </a>
    <main class="starfield-shell" aria-label="starfield">
      <div id="starfield" class="starfield" aria-hidden="true"></div>
      <p class="starfield-hint" aria-hidden="true">
        <span class="starfield-hint__mouse">Move to look around</span>
        <span class="starfield-hint__touch">Drag to look around</span>
      </p>
      <p class="sr-only">
        A full-screen generative starfield. Stars arrive automatically. Move the pointer or drag to look around.
      </p>
    </main>
    <script defer src="./starfield.js?v=interaction-hint-1"></script>
  </body>
</html>
